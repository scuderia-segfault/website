<text x="64" y="1189" fill="#bdc9c1" font-family="Arial, sans-serif" font-size="16" font-weight="400">H-Flow uses USB-derived 5 V for power. Its data travels over DroneCAN through an adapter.</text>
<text x="64" y="1215" fill="#bdc9c1" font-family="Arial, sans-serif" font-size="16" font-weight="400">12 V and Ethernet are separate at the LiDAR. Sketch notes USB-C for front camera and USB-A for rear camera;</text>
<text x="64" y="1240" fill="#bdc9c1" font-family="Arial, sans-serif" font-size="16" font-weight="400">if using ZED X Mini, use a compatible GMSL2 capture and power path.</text>
