<text x="64" y="499" fill="#bdc9c1" font-family="Arial, sans-serif" font-size="15" font-weight="400">Battery-side “5 mm” and VESC-side “6 mm” are noted.</text>
<text x="64" y="522" fill="#bdc9c1" font-family="Arial, sans-serif" font-size="15" font-weight="400">Verify the exact terminals, cable size and current rating.</text>
<text x="64" y="546" fill="#bdc9c1" font-family="Arial, sans-serif" font-size="15" font-weight="400">4S is 16.8 V full. Pack annotations conflict; verify the pack.</text>
<text x="64" y="570" fill="#bdc9c1" font-family="Arial, sans-serif" font-size="15" font-weight="400">The scan crosses out the 80 A fuse; protection sizing is open.</text>
<text x="64" y="693" fill="#bdc9c1" font-family="Arial, sans-serif" font-size="16" font-weight="400">TRACO local sense: link 8 (+Sense) to 9 (+VOUT) and 6 (−Sense) to 5 (−VOUT). Input and output are isolated at the module.</text>
<text x="64" y="718" fill="#bdc9c1" font-family="Arial, sans-serif" font-size="16" font-weight="400">TRACO rating: 12 V × 15 A = 180 W, subject to thermal derating. At 14.8 V in and 89% efficiency, 180 W out implies ~13.7 A in.</text>
<text x="64" y="743" fill="#bdc9c1" font-family="Arial, sans-serif" font-size="16" font-weight="400">At 12 V in and 90% efficiency, a 7.4 V / 4 A servo load would draw about 2.7 A at the regulator input (example).</text>
<text x="64" y="768" fill="#bdc9c1" font-family="Arial, sans-serif" font-size="16" font-weight="400">Use a regen-capable supply or a validated braking-energy solution for powered motor tests.</text>
<rect x="40" y="809" width="1320" height="466" rx="12" fill="#1d2521" stroke="#38443d"/>
